# Snapper configuration for Zohara system snapshots (Btrfs root).
# Installed to /etc/snapper/configs/root by `zohara-snapshots setup`.
# Snapshots are taken before and after every package change by snap-pac, and
# are listed in the boot menu by grub-btrfs. /home is a separate subvolume and
# is not part of them.

SUBVOLUME="/"
FSTYPE="btrfs"

# Space limits need Btrfs quotas, which slow snapshots down, so they are off.
# The number limit below and FREE_LIMIT keep the disk from filling up.
QGROUP=""
SPACE_LIMIT="0.5"
FREE_LIMIT="0.2"

# Members of "wheel" (the administrators) can list snapshots without a password.
ALLOW_USERS=""
ALLOW_GROUPS="wheel"
SYNC_ACL="yes"

BACKGROUND_COMPARISON="yes"

# Keep the newest NUMBER_LIMIT snapshots; a pair (before + after an update)
# counts as two, so 10 is about five updates. Settings > Storage changes this.
NUMBER_CLEANUP="yes"
NUMBER_MIN_AGE="1800"
NUMBER_LIMIT="10"
NUMBER_LIMIT_IMPORTANT="5"

# No hourly snapshots: only around changes.
TIMELINE_CREATE="no"
TIMELINE_CLEANUP="no"
TIMELINE_MIN_AGE="1800"
TIMELINE_LIMIT_HOURLY="0"
TIMELINE_LIMIT_DAILY="0"
TIMELINE_LIMIT_WEEKLY="0"
TIMELINE_LIMIT_MONTHLY="0"
TIMELINE_LIMIT_YEARLY="0"

EMPTY_PRE_POST_CLEANUP="yes"
EMPTY_PRE_POST_MIN_AGE="1800"
