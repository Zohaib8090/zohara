name: Build & Verify Zohara Settings (Arch Linux)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release Binary (Arch Linux Native)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install Arch Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            rust \
            gtk4 \
            libadwaita \
            dbus \
            pkgconf

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Check Code
        run: cargo check --release

      - name: Build Release Binary
        run: cargo build --release

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zohara-settings-arch-x86_64
          path: target/release/zohara-settings
