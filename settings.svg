<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Base Squircle Shape -->
  <rect x="5" y="5" width="90" height="90" rx="38" fill="#3f5a81" />
  
  <!-- Mask for Gear Cutouts -->
  <mask id="gear-mask">
    <!-- Keep white circle base visible -->
    <rect x="0" y="0" width="100" height="100" fill="white" />
    
    <!-- Inner central hole -->
    <circle cx="50" cy="50" r="14.5" fill="black" />
    
    <!-- 8 outer semi-circular teeth cutouts -->
    <g fill="black">
      <circle cx="50" cy="15" r="7" />
      <circle cx="50" cy="15" r="7" transform="rotate(45 50 50)" />
      <circle cx="50" cy="15" r="7" transform="rotate(90 50 50)" />
      <circle cx="50" cy="15" r="7" transform="rotate(135 50 50)" />
      <circle cx="50" cy="15" r="7" transform="rotate(180 50 50)" />
      <circle cx="50" cy="15" r="7" transform="rotate(225 50 50)" />
      <circle cx="50" cy="15" r="7" transform="rotate(270 50 50)" />
      <circle cx="50" cy="15" r="7" transform="rotate(315 50 50)" />
    </g>
  </mask>
  
  <!-- Outer White Gear Layer -->
  <circle cx="50" cy="50" r="32" fill="#f4f5f7" mask="url(#gear-mask)" />
</svg>
