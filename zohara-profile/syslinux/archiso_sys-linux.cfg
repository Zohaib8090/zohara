UI vesamenu.c32
MENU TITLE Zohara OS
MENU BACKGROUND /boot/syslinux/splash.png
TIMEOUT 50
DEFAULT zohara-zen

LABEL zohara-zen
    MENU LABEL Zohara OS (Linux-Zen)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=ZOHARA_ISO
