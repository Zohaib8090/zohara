UI vesamenu.c32
MENU TITLE Zohara OS
MENU BACKGROUND /boot/syslinux/splash.png
TIMEOUT 50
DEFAULT zohara

LABEL zohara
    MENU LABEL Zohara OS
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=ZOHARA_ISO rd.systemd.gpt_auto=0

LABEL zohara-open
    MENU LABEL Zohara OS (Open Source Drivers)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=ZOHARA_ISO modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm rd.systemd.gpt_auto=0

LABEL zohara-nvidia
    MENU LABEL Zohara OS with Nvidia Drivers
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=ZOHARA_ISO nvidia-drm.modeset=1 rd.systemd.gpt_auto=0

LABEL zohara-safe
    MENU LABEL Zohara OS Safe Mode
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=ZOHARA_ISO nomodeset single rd.systemd.gpt_auto=0
