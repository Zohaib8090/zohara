# Zohara OS — hand /etc/resolv.conf to systemd-resolved.
#
# systemd-resolved.service is enabled in this profile, and the nsswitch.conf that ships with the
# `filesystem` package uses "hosts: mymachines resolve [!UNAVAIL=return] files myhostname dns", so
# name resolution already goes through the resolved stub on 127.0.0.53. The canonical Arch setup is for
# /etc/resolv.conf to be a symlink to the stub file, which resolved regenerates from whatever
# NetworkManager hands it (including per-link search domains, which a static file cannot provide).
#
# This is done with tmpfiles rather than the two more obvious places, for concrete reasons:
#
#   * Not as a symlink in the airootfs overlay: Windows checkouts cannot create symlinks (no
#     SeCreateSymbolicLinkPrivilege) -- the same limitation that forces the 18 systemd units under
#     airootfs/etc/systemd/ to be pinned with `git update-index --skip-worktree`. A 19th such symlink
#     would be unmaintainable from a Windows clone.
#
#   * Not in customize_airootfs.sh: `arch-chroot` bind-mounts the build host's /etc/resolv.conf over
#     that path so pacman can resolve names inside the chroot, so it is an active mountpoint for the
#     whole run. `ln -sfn` there fails with "Device or resource busy", and because that script uses
#     `set -e` the failure aborts mkarchiso and no ISO is produced. Tried on 2026-08-24; it killed the
#     build.
#
# "L+" force-creates the symlink, removing whatever file is already at the path first -- which is
# exactly what is needed, since the overlay ships a static placeholder resolv.conf as a fallback for
# the window before systemd-tmpfiles-setup.service runs. A briefly dangling link is harmless: nsswitch
# reaches resolved over D-Bus regardless of what this file says.
#
# Keep the overlay's placeholder free of any host-specific "search" or "domain" line. Until
# 2026-08-24 it was a verbatim copy of the build machine's stub, which leaked that machine's private
# VPN search domain into every shipped image.

#Type Path             Mode User Group Age Argument
L+    /etc/resolv.conf -    -    -     -   /run/systemd/resolve/stub-resolv.conf
