# Zohara OS — fix /etc/localtime on the booted system.
#
# /etc/localtime in the airootfs overlay cannot be a real symlink because
# the profile is checked out on Windows (no SeCreateSymbolicLinkPrivilege).
# The result is that the overlay ships a 23-byte TEXT FILE containing the
# path "/usr/share/zoneinfo/UTC" -- which glibc cannot read as timezone data,
# so `date` and every other program that calls tzset() reports the wrong
# time. Verified on the 2026-08-24 ISO.
#
# Replace it with a real symlink to the zoneinfo file at first boot.
# "L+" force-creates the link, removing whatever's at the path first.

#Type Path            Mode User Group Age Argument
L+     /etc/localtime -    -    -     -   /usr/share/zoneinfo/UTC
