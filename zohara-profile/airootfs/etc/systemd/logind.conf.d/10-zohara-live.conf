# Zohara OS - systemd-logind configuration
#
# Live ISO default: do NOT suspend on lid close or power button. Closing
# the laptop lid while the live system is running should be a no-op, not
# put the machine to sleep. The user is testing the ISO; surprise suspend
# is hostile.
#
# `ignore` is the correct value here -- it makes the kernel ACPI events
# visible to userspace (so KDE Power Manager can still react if the user
# configures it later) without taking any default action.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
