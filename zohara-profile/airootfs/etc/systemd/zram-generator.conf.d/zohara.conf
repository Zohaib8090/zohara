# Compressed memory (zram) swap, on from the first boot. Settings > Power & battery > Swap shows this as the "Compressed memory" switch;
# deleting this file (or turning the switch off) removes it. The disk swap partition stays as the second choice.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
