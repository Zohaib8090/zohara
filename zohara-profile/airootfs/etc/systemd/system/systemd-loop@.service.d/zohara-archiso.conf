# Zohara OS: tighten the systemd loopback attach so the FAILED red line stops
# showing up on boots where the ISO medium is not /dev/sr0.
#
# Background
# ----------
# archiso's live stack uses systemd-loop@<device>.service to attach the boot
# medium as a loopback block device so the squashfs can be mounted. On a real
# optical disc this is essential. On a USB stick, a virtio-blk device, or a VM
# that hands the ISO to QEMU as /dev/vda the unit still fires, loses the race
# against ldconfig.service (default 15s), and then FAILEDs with:
#
#     [FAILED] Failed to start Attach File .../block/sr0 to Loopback Block Device.
#
# That is noisy and misleading -- first-time users see a red FAILED on the
# Plymouth splash and assume the ISO is broken, when in fact the boot is fine
# (the squashfs is reachable by a different name).
#
# What this drop-in does
# ----------------------
# Two directives, both safe:
#
#  1. ConditionKernelCommandLine=archisobasedir=*
#     Only start the loopback attach if the kernel cmdline says this is an
#     archiso boot. The four Zohara loader entries in
#     zohara-profile/efiboot/loader/entries/ all set
#     `archisobasedir=%INSTALL_DIR%`, so this matches every legit archiso
#     path. An installed system running systemd-loop@<anything> for a real
#     loop-mount (e.g. a snapper snapshot) is unaffected because
#     `archisobasedir=` is not on a normal installed kernel's cmdline.
#
#  2. TimeoutStartSec=30
#     The upstream unit has no timeout. ldconfig.service is gated by a 15s
#     start-job timer on first boot, so the loopback attach can sit in the
#     queue for up to 15s before it even starts. 30s gives it headroom on
#     the slowest real hardware we've targeted (e.g. 4-core Atom laptops)
#     without ever being the cause of a hang on a hung device.
#
# The FAILED line in the boot log is replaced with a quiet "condition not met"
# or a successful attach -- never a red error for a working boot.

[Unit]
ConditionKernelCommandLine=archisobasedir=*

[Service]
TimeoutStartSec=30
