# Configuration file for Calamares
modules-search: [ local ]

instances:
- id:       keyring
  module:   shellprocess
  config:   shellprocess_keyring.conf
- id:       services
  module:   shellprocess
  config:   shellprocess_services.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - fstab
  - locale
  - keyboard
  - localecfg
  - networkcfg
  - hwclock
  - initcpiocfg
  - initcpio
  - shellprocess@keyring
  - users
  - displaymanager
  - shellprocess@services
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: zohara
prompt-install: true
dont-chroot: false
