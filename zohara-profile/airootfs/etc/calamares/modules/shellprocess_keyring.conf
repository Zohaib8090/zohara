i18n:
  name: "Initializing pacman keyring"

dontChroot: false
timeout: 300
script:
  - "pacman-key --init"
  - "pacman-key --populate archlinux"
  # Chaotic-AUR's signing keys (chaotic-keyring), so the installed system can
  # verify its packages instead of trusting them blindly.
  - "pacman-key --populate chaotic || true"
  # Zohara's own package-signing key (zohara-keyring): import it and trust it, as the package's install script does
  # on an installed system (the copy in the live image ran before this keyring existed).
  - "pacman-key --populate zohara || true"
  # No dollar signs in these lines: Calamares reads a dollar-prefixed word as one of its own variables and refuses to run the command.
  - "sh -c 'cut -d: -f1 /usr/share/pacman/keyrings/zohara-trusted | xargs -r -n1 pacman-key --lsign-key || true'"
