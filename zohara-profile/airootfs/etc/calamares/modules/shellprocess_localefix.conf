i18n:
  name: "Setting number and date formats"

# Calamares sets numbers, dates and so on (LC_*) from the chosen region, so English with region Pakistan gave Urdu dates and numbers on the
# lock screen. Keep only LANG: the formats follow the language. They can be changed later in Settings.
dontChroot: false
timeout: 30
script:
  - "sed -i '/^LC_/d' /etc/locale.conf"
