# Calamares users step. Same as the packaged default except the suggested computer name: the default template was "derp-${cpu}"
# (shown as "derp-x8664"); it is now just "zohara". Checked 2026-10-20 against /usr/share/calamares/modules/users.conf of the image.
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - name: nopasswdlogin
      must_exist: false
      system: true
sudoersGroup:    wheel
autologinGroup:  autologin
sudoersConfigureWithGroup: false
setRootPassword: true
doReusePassword: false
displayAutologin:   false
doAutologin:     false
passwordRequirements:
    minLength: -1  # Password at least this many characters
    maxLength: -1  # Password at most this many characters
    libpwquality:
        - minlen=0
        - minclass=0
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"
  nopasswd_group: "nopasswdlogin"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "zohara"
  forbidden_names: [ localhost ]
allowActiveDirectory: false
presets:
    fullName:
        editable: true
    loginName:
        editable: true
