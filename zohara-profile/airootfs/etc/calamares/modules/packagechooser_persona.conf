mode: required
method: legacy
labels:
    step: "Personas"

items:
  - id: persona_developer
    name: "Developer Persona"
    description: "Includes compilers, Rust toolchain, IDEs, and Docker/Podman."
    packages:
      - base-devel
      - rust
      - go
      - docker
      - podman
      - code
      - neovim

  - id: persona_gamer
    name: "Gamer Persona"
    description: "Includes Steam, Lutris, Gamemode, Wine, MangoHud, and optimized drivers."
    packages:
      - steam
      - lutris
      - gamemode
      - wine
      - mangohud
      - vulkan-tools
      - lib32-mesa

  - id: persona_general
    name: "General Persona"
    description: "Daily driver apps, media codecs, and web browsers."
    packages:
      - firefox
      - vlc
      - libreoffice-fresh
      - gst-plugins-good
      - gst-plugins-bad
      - gst-plugins-ugly
