i18n:
  name: "Finishing the installation"

dontChroot: false
timeout: 120
script:
  # The live ISO's own convenience settings must never reach an installed
  # system — an audit found several of these had never been stripped (see
  # scripts/ota-exclude.txt, which already strips the same set from OTA
  # updates; this does the equivalent at install time):
  #   - Live-only openssh server, wide open (root login, password auth). It
  #     isn't installed on the ISO, but `zohara-migrate` can pull it in via
  #     Ubuntu's openssh-server -> openssh package mapping, and it would then
  #     start accepting root logins by password.
  - "systemctl disable sshd.service 2>/dev/null || true"
  - "rm -f /etc/ssh/sshd_config.d/10-archiso.conf"
  #   - Live-only power handling (never suspend on lid close / power button)
  #     and a volatile (RAM-only, lost on reboot) journal, both meant only for
  #     someone testing the live session.
  - "rm -f /etc/systemd/logind.conf.d/do-not-suspend.conf /etc/systemd/logind.conf.d/10-zohara-live.conf"
  - "rm -f /etc/systemd/journald.conf.d/volatile-storage.conf"
  #   - The archiso Wi-Fi backend. NetworkManager (enabled above, in
  #     shellprocess_services.conf) has its own Wi-Fi handling; leaving iwd
  #     enabled too means the two contend for the wireless card.
  - "systemctl disable iwd.service 2>/dev/null || true"
  #   - The installer itself. It has no use on an installed system, and it
  #     came from the build's local repository, which installed systems
  #     don't have, so it could never be updated either.
  - "pacman -Rn --noconfirm calamares 2>/dev/null || true"
  - "rm -f /usr/share/applications/calamares.desktop /etc/xdg/autostart/calamares.desktop"
  # (Not stripped here on purpose: scripts/ota-exclude.txt as a whole. It also
  # lists etc/passwd, etc/shadow, etc/hostname and etc/locale.conf, which the
  # installer's own steps have just written for the new system; deleting them
  # would lock the new user out. zohara-install-kernel removes the rest of
  # the live-only units before this step.)
  # GRUB's os-prober is off by default upstream, so dual-boot Windows/other
  # Linux installs are silently left out of the boot menu. Turn it on and
  # regenerate grub.cfg now that bootloader (which runs just before this
  # step) has actually installed GRUB.
  - "grep -q '^GRUB_DISABLE_OS_PROBER=false' /etc/default/grub || (sed -i '/^GRUB_DISABLE_OS_PROBER=/d' /etc/default/grub && echo GRUB_DISABLE_OS_PROBER=false >> /etc/default/grub)"
  - "grub-mkconfig -o /boot/grub/grub.cfg 2>/dev/null || true"
