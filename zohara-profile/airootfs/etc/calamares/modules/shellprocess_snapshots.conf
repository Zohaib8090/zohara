# Runs inside the new system, before the initramfs is built: on Btrfs, adds the
# hook that lets a snapshot be booted from the GRUB menu. Does nothing on ext4.
---
i18n:
  name: "Setting up system snapshots"
dontChroot: false
timeout: 60
script:
  - "/usr/bin/zohara-snapshots prepare-initramfs || true"
