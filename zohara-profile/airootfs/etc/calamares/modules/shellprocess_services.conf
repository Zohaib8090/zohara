i18n:
  name: "Enabling system services"

dontChroot: false
timeout: 120
script:
  # Core system services
  - "systemctl enable NetworkManager.service"
  - "systemctl enable sddm.service"
  - "systemctl enable bluetooth.service"
  - "systemctl enable fstrim.timer"
  # PipeWire audio (user services — enabled for all new users via skel symlinks)
  # These are already set up in /etc/skel/.config/systemd/user/
  # Flatpak: add Flathub remote if flatpak is installed
  - "flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true"
  # Remove Discover from installed system
  - "pacman -Rdd --noconfirm discover packagekit-qt6 2>/dev/null || true"
