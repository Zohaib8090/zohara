# Partitioning defaults for the Zohara installer.
#
# Btrfs is the default file system because it makes system snapshots nearly
# free (see zohara-snapshots): every update is snapshotted, and a bad one can
# be undone from Zohara Store or the boot menu. ext4 and xfs stay available
# under "Manual partitioning"; snapshots simply aren't offered there.
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M

userSwapChoices:
    - none
    - small

initialPartitioningChoice: erase
initialSwapChoice: small

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]
