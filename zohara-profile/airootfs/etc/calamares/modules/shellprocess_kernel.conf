i18n:
  name: "Copying kernel to target system"

dontChroot: true
timeout: 120
script:
  - "-bash -c 'TARGET=$$(ls -d /tmp/calamares-root-* 2>/dev/null | head -1) && [ -n \"$$TARGET\" ] && mkdir -p \"$$TARGET/boot\" && cp /run/archiso/bootmnt/arch/x86_64/vmlinuz-linux-zen \"$$TARGET/boot/vmlinuz-linux-zen\" && echo \"Kernel copied OK\" || exit 1'"
