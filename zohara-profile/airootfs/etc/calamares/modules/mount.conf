# How the installer mounts the target system.
#
# On Btrfs the system is split into subvolumes so snapshots cover only what
# they should:
#   @           the system (this is what gets snapshotted and restored)
#   @home       your files (never rolled back with the system)
#   @snapshots  where snapshots are kept
#   @log        /var/log, so logs survive a restore
#   @pkg        pacman's package cache, so older versions stay available
#               for "Go back" in Zohara Store even after a restore
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    # EFI variables inside the new system, so grub-install can register its
    # boot entry. This used to be a separate `extraMountsEfi:` list, which
    # Calamares 3.3 dropped (it's `efi: true` on an entry now) and 3.4
    # silently ignores -- so efivarfs was never mounted, and every UEFI
    # install failed at the bootloader step with "EFI variables are not
    # supported on this system" (seen on a Dell Latitude, 2026-09-28).
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd ]
      ssdOptions: [ discard=async ]

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache/pacman/pkg
      subvolume: /@pkg
