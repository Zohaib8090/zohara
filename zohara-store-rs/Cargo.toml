[package]
name = "zohara-store"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zohara-store"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", package = "libadwaita", features = ["v1_6"] }
glib = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1.4"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
