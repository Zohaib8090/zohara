name: Build & Publish Zohara Themes

# Builds zohara-themes: Zohara's own pinned copies of the Fluent icon, cursor and GTK themes and the Nordzy icons (they used to come
# from Chaotic-AUR as rolling "-git" builds). Four packages from one PKGBUILD; the upstream commits are fixed inside it.
# Like the other package builds it only builds and keeps the packages as this run's artifact; publish-alpha.yml sends them to alpha,
# beta and stable are chosen on purpose from the release admin site.

on:
  push:
    branches: [master]
    paths:
      - 'zohara-themes/**'
      - '.github/workflows/build-themes.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build theme packages
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git sassc gtk-update-icon-cache hicolor-icon-theme

      - uses: actions/checkout@v4

      - name: Run makepkg
        run: |
          set -euo pipefail
          useradd -m builder
          cp -r zohara-themes /home/builder/build
          chown -R builder /home/builder/build
          cd /home/builder/build
          # Every build is newer than the last, so pacman offers it as an update.
          su builder -c "_PKGVER=$(date -u +%Y%m%d%H%M) makepkg -f --nodeps --noconfirm"
          ls -la *.pkg.tar.zst
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp *.pkg.tar.zst "$GITHUB_WORKSPACE/out/"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: zohara-themes-arch
          path: out/*.pkg.tar.zst
