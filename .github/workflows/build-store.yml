name: Build & Publish Zohara Store

# Builds and tests zohara-store-rs and uploads the package as the run's artifact. It does not publish:
# publish-alpha.yml sends every finished build to the alpha channel, and beta and stable are chosen on the
# release admin site. Other changes do not trigger it.

on:
  push:
    branches: [master, beta]
    paths:
      - 'zohara-store-rs/**'
      - '.github/workflows/build-store.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PKG: zohara-store

jobs:
  build:
    name: Build + package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install Arch build dependencies
        run: |
          # Build against the same Arch day users are pinned to, so binaries
          # link against the libraries users actually have.
          D=$(curl -fsSL https://raw.githubusercontent.com/Zohaib8090/zohara-pipeline/main/manifest.json | sed -n 's/.*"approved_date": *"\([0-9/]*\)".*/\1/p')
          [ -n "$D" ] || { echo "::error::could not read approved_date from zohara-pipeline"; exit 1; }
          echo "Building against Arch as of $D"
          echo "Server = https://archive.archlinux.org/repos/$D/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          pacman -Syuu --noconfirm
          pacman -S --noconfirm --needed base-devel git rust sudo github-cli gtk4 libadwaita glib2 curl polkit pkgconf
          useradd -m builder || true
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          BASE=$(grep '^version' zohara-store-rs/Cargo.toml | head -1 | cut -d'"' -f2)
          [ -n "$BASE" ] || { echo "::error::Could not read version from Cargo.toml"; exit 1; }
          # Cargo version + build time: always newer than the last build, so
          # pacman on installed systems sees it as an update.
          VER="$BASE.$(date -u +%Y%m%d%H%M)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          chown -R builder:builder .
          cd zohara-store-rs
          sudo -u builder cargo test --release

      # The PKGBUILD's build() runs `cargo build --release --locked`, so
      # makepkg is also the compile check.
      - name: Run makepkg
        run: |
          chown -R builder:builder .
          cd zohara-store-rs
          sudo -u builder env _PKGVER="${{ steps.version.outputs.version }}" makepkg --nocheck --skippgpcheck --nodeps
          PKG_FILE=$(ls *.pkg.tar.zst | head -1)
          echo "package_file=$PKG_FILE" >> "$GITHUB_ENV"
          echo "package_path=zohara-store-rs/$PKG_FILE" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: zohara-store-arch-x86_64
          path: ${{ env.package_path }}
