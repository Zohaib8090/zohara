name: Build Zohara OTA Update

on:
  push:
    tags:
      - 'v*.*.*' # Triggers when a new version tag is pushed (e.g., v1.0.1)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-ota:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Arch Linux environment
      run: |
        sudo apt-get update
        sudo apt-get install -y zstd fakeroot libarchive-tools
        # Install pacman for repo-add via a prebuilt static binary or build it
        # Actually, let's just use an Arch docker container for native tools!

    - name: Build OTA Package and Repo
      run: |
        VERSION="${{ github.event.inputs.version || github.ref_name }}"
        VERSION=${VERSION#v} # strip 'v' if present
        
        docker run --rm -i -v $(pwd):/work -e VERSION="$VERSION" archlinux:base /bin/bash -s <<'DOCKEREOF'
          # Without this, a failing makepkg is ignored and the step's exit code comes
          # from the last command, so the workflow goes green having built nothing.
          set -euo pipefail

          pacman -Sy --noconfirm base-devel
          useradd -m builduser
          chown -R builduser:builduser /work

          cd /work

          # The 8-space indent below is the YAML block-scalar base indent, which YAML
          # strips before bash sees it -- so these lines arrive at column 0 and the
          # `EOF` terminator matches. Do not dedent them further: that breaks the YAML.
          cat << EOF > PKGBUILD
        pkgname=zohara-system
        pkgver=$VERSION
        pkgrel=1
        pkgdesc="Zohara OS System OTA Updates"
        arch=("any")
        url="https://github.com/Zohaib8090/zohara"
        license=("GPL")

        package() {
            # Copy everything from airootfs directly to the root filesystem
            cp -a "/work/zohara-profile/airootfs/." "\${pkgdir}/"

            # airootfs/ is a LIVE ISO overlay. Most of archiso's own scaffolding in there is
            # destructive on an installed machine -- etc/passwd wipes the user's accounts, etc/shadow
            # leaves root with an empty password, the getty/SDDM drop-ins autologin root, and
            # mkinitcpio.conf.d/archiso.conf makes the next kernel update build an unbootable
            # initramfs. scripts/ota-exclude.txt is the shared list of paths that must never ship in
            # an update, with the reasoning and the command used to derive it; create_update_bundle.sh
            # applies the same list to the self-extracting-bundle channel.
            EXCLUDE_LIST=/work/scripts/ota-exclude.txt
            if [ ! -f "\$EXCLUDE_LIST" ]; then
                echo "FATAL: \$EXCLUDE_LIST missing -- refusing to package live-ISO scaffolding" >&2
                return 1
            fi
            while IFS= read -r rel; do
                rel="\${rel%%#*}"
                rel="\$(printf '%s' "\$rel" | tr -d '[:space:]')"
                [ -z "\$rel" ] && continue
                case "\$rel" in /*|*..*) continue ;; esac
                rm -f "\${pkgdir}/\$rel"
            done < "\$EXCLUDE_LIST"

            # Belt and braces: these are the entries that destroy a user's system, so abort rather
            # than publish a package if the exclusion list was somehow not applied.
            for critical in etc/passwd etc/shadow root/customize_airootfs.sh \\
                            etc/systemd/system/getty@tty1.service.d/autologin.conf; do
                if [ -e "\${pkgdir}/\$critical" ]; then
                    echo "FATAL: \$critical survived stripping -- refusing to package" >&2
                    return 1
                fi
            done
        }
        EOF

          # Run makepkg as non-root
          su builduser -c 'makepkg -cf'

          # Setup repository database
          mkdir -p ota-repo
          mv zohara-system-*.pkg.tar.zst ota-repo/
          cd ota-repo
          repo-add zohara.db.tar.gz zohara-system-*.pkg.tar.zst
          # repo-add creates symlinks, we need the actual files for github releases
          cp zohara.db.tar.gz zohara.db
          cp zohara.files.tar.gz zohara.files
        DOCKEREOF

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ota-repo/zohara-system-*.pkg.tar.zst
          ota-repo/zohara.db
          ota-repo/zohara.files
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
