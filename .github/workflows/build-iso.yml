name: Build Zohara OS ISO

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub Actions runners have limited disk space; free up space before the huge build
    steps:
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker system prune -af
        df -h

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Docker builder image
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: zohara-builder:latest
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    # Move cache to prevent it from growing unboundedly
    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Build ISO
      run: |
        mkdir -p out
        docker run --rm --privileged \
          -v $(pwd):/build \
          zohara-builder

    - name: Validate boot files in ISO
      run: |
        ISO=$(ls out/*.iso | head -1)
        echo "Inspecting ISO: $ISO"

        # Use 7z to inspect ISO contents (pre-installed on GitHub runners)
        echo "=== Boot files in ISO ==="
        7z l "$ISO" | grep -E "vmlinuz|initramfs" | grep -v squashfs

        # Validate vmlinuz-linux-zen is present
        if ! 7z l "$ISO" | grep -q "vmlinuz-linux-zen"; then
          echo "❌ FATAL: vmlinuz-linux-zen missing from ISO!"
          exit 1
        fi
        echo "✅ vmlinuz-linux-zen found"

        # Validate initramfs-linux-zen.img is present
        if ! 7z l "$ISO" | grep -q "initramfs-linux-zen"; then
          echo "❌ FATAL: initramfs-linux-zen.img missing from ISO!"
          exit 1
        fi
        echo "✅ initramfs-linux-zen.img found"

        # Extract and show loader entries
        echo "=== Loader entry: 01-zohara.conf ==="
        7z e -so "$ISO" loader/entries/01-zohara.conf 2>/dev/null

        # Validate no stale ucode.img references remain in loader entries
        for entry in 01-zohara.conf 01-zohara-nvidia.conf 02-zohara-open.conf 02-zohara-safe.conf 03-zohara-safe.conf; do
          content=$(7z e -so "$ISO" loader/entries/$entry 2>/dev/null)
          if [ -n "$content" ] && echo "$content" | grep -q "ucode.img"; then
            echo "❌ FATAL: $entry still references ucode.img — this will cause boot failure!"
            exit 1
          fi
          echo "✅ $entry: no stale ucode references"
        done

        echo ""
        echo "✅ Boot validation passed! ISO is ready to flash."

    - name: Show ISO info
      run: |
        ls -lh out/*.iso
        7z l out/*.iso | grep -E "^Date|^Path|Type|Physical" | head -10

    - name: Upload ISO as artifact
      uses: actions/upload-artifact@v4
      with:
        name: zohara-os-x86_64
        path: out/*.iso
        retention-days: 7

    # Only publish a GitHub Release when a version tag (v*) is pushed
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: out/*.iso
        name: "Zohara OS ${{ github.ref_name }}"
        body: |
          ## Zohara OS ${{ github.ref_name }}

          Built from commit ${{ github.sha }}.

          ### Boot Notes
          - UEFI: systemd-boot with linux-zen kernel
          - Microcode is baked into initramfs (no separate ucode.img needed)
          - Label: `ZOHARA_ISO`

          ### Download
          Flash to USB with:
          ```bash
          sudo dd if=zohara-os-*.iso of=/dev/sdX bs=4M status=progress oflag=sync
          ```
