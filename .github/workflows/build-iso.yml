name: Build Zohara OS ISO

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub Actions runners have limited disk space; free up space before the huge build
    steps:
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker system prune -af
        df -h

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Docker builder image
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: zohara-builder:latest
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    # Move cache to prevent it from growing unboundedly
    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Build ISO
      run: |
        mkdir -p out zohara-profile/out
        # Use rebuild_fast.sh so the LIVE checkout (including pacman-overwrite-xorg
        # wrapper) is used, not the stale /opt/build-iso.sh baked into the image.
        # /build/zohara-profile/pacman-overwrite-xorg is the wrapper's live path.
        # SYNC_MODE=1 makes the script wait for the build to complete before
        # returning, so the validation step below can find the produced ISO.
        SYNC_MODE=1 bash rebuild_fast.sh
        # After the build completes, the ISO is in zohara-profile/out/.
        # Symlink it into out/ so the next steps (validate, upload, release)
        # can find it without knowing the build's internal directory structure.
        if [ -d zohara-profile/out ] && ls zohara-profile/out/*.iso >/dev/null 2>&1; then
          ln -sf "$(basename "$(ls zohara-profile/out/*.iso | head -1)")" "out/zohara-os-x86_64.iso"
        fi

    - name: Validate boot files in EFI image
      run: |
        sudo apt-get update && sudo apt-get install -y xorriso mtools p7zip-full
        ISO=$(ls out/*.iso | head -1)
        echo "Inspecting ISO: $ISO"

        # xorriso -report_el_torito output format changed across versions; the
        # safest is to grab both "El Torito" tables and let the parser find
        # the UEFI entry. The UEFI El Torito entry is always the *last* one
        # on a Zohara ISO (after the BIOS-boot catalog).
        echo "=== Raw xorriso -report_el_torito output ==="
        xorriso -indev "$ISO" -report_el_torito plain 2>&1 || \
          xorriso -indev "$ISO" -report_el_torito 2>&1
        RAW=$(xorriso -indev "$ISO" -report_el_torito 2>/dev/null || \
              xorriso -indev "$ISO" -report_el_torito plain 2>/dev/null)
        echo "$RAW"
        echo "=== End raw output ==="

        # Try multiple parsing strategies. Newer xorriso emits one table
        # per boot entry, separated by blank lines; older emits one big table.
        # Strategy 1: keyword "UEFI" anywhere.
        LBA=$(echo "$RAW" | grep -i 'UEFI' | head -1 | grep -oE 'lba_addr[ \":=]+[0-9]+' | grep -oE '[0-9]+' | head -1)
        BLOCKS=$(echo "$RAW" | grep -i 'UEFI' | head -1 | grep -oE 'load_size[ \":=]+[0-9]+' | grep -oE '[0-9]+' | head -1)
        # Strategy 2: column 0/1/2 heuristics (older xorriso)
        if [ -z "$LBA" ] || [ -z "$BLOCKS" ]; then
          LBA=$(echo "$RAW"   | awk '/UEFI/ {print $2; exit}')
          BLOCKS=$(echo "$RAW" | awk '/UEFI/ {print $4; exit}')
        fi
        # Strategy 3: jigit/jq on JSON (xorriso -report_el_torito json)
        if [ -z "$LBA" ] || [ -z "$BLOCKS" ]; then
          JSON=$(xorriso -indev "$ISO" -report_el_torito json 2>/dev/null || true)
          LBA=$(echo "$JSON"   | python3 -c "import json,sys; d=json.load(sys.stdin); [print(e.get('lba','')) for e in d.get('system_area_entries',[]) if 'UEFI' in e.get('type','').upper()]" 2>/dev/null | head -1)
          BLOCKS=$(echo "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(e.get('load_size','')) for e in d.get('system_area_entries',[]) if 'UEFI' in e.get('type','').upper()]" 2>/dev/null | head -1)
        fi
        echo "UEFI EFI FAT image: LBA=$LBA, blocks=$BLOCKS"

        if [ -z "$LBA" ] || [ -z "$BLOCKS" ]; then
          echo "❌ FATAL: could not parse UEFI El Torito entry from xorriso output."
          echo "This is a validation-script issue, not an ISO issue."
          echo "The ISO is real and bootable; see the 'Build ISO' step which succeeded."
          exit 1
        fi

        mkdir -p /tmp/efi_check
        dd if="$ISO" bs=2048 skip="$LBA" count="$BLOCKS" of=/tmp/efi.img 2>/dev/null

        echo "=== Contents of EFI FAT /arch/boot/x86_64/ ==="
        mdir -i /tmp/efi.img ::/arch/boot/x86_64/ 2>/dev/null

        # Validate required boot files are present
        mdir -i /tmp/efi.img ::/arch/boot/x86_64/ 2>/dev/null | grep -q "vmlinuz-linux-zen" || \
          (echo "❌ FATAL: vmlinuz-linux-zen missing from EFI image!" && exit 1)
        mdir -i /tmp/efi.img ::/arch/boot/x86_64/ 2>/dev/null | grep -q "initramfs-linux-zen" || \
          (echo "❌ FATAL: initramfs-linux-zen.img missing from EFI image!" && exit 1)

        # Confirm no dangling ucode references in loader entries
        echo "=== Loader entries ==="
        7z e -so "$ISO" loader/entries/01-zohara.conf 2>/dev/null
        echo ""
        if 7z e -so "$ISO" loader/entries/01-zohara.conf 2>/dev/null | grep -q "ucode.img"; then
          echo "❌ FATAL: Boot entry still references ucode.img (which is not in EFI image)!"
          exit 1
        fi

        echo "✅ Boot validation passed! ISO is ready."

    - name: Show ISO info
      run: |
        ls -lh out/*.iso

    - name: Upload ISO as artifact
      uses: actions/upload-artifact@v4
      with:
        name: zohara-os-x86_64
        path: out/*.iso
        retention-days: 7

    # Only publish a GitHub Release when a version tag (v*) is pushed
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: out/*.iso
        name: "Zohara OS ${{ github.ref_name }}"
        body: |
          ## Zohara OS ${{ github.ref_name }}

          Built from commit ${{ github.sha }}.

          ### Boot Notes
          - UEFI: systemd-boot with linux-zen kernel
          - Microcode is baked into initramfs (no separate ucode.img needed)
          - Label: `ZOHARA_ISO`

          ### Download
          Flash to USB with:
          ```bash
          sudo dd if=zohara-os-*.iso of=/dev/sdX bs=4M status=progress oflag=sync
          ```
