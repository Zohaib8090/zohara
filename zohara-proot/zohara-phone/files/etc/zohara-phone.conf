# Zohara for phones: defaults. Override any of these in ~/.config/zohara-phone.conf.
#
# SCALE   interface size, a whole number: 1 = small, 2 = normal for phones, 3 = large
# QUICK   how Plasma draws: software (fastest without a GPU) or gl (needed for virgl)
# EFFECTS on/off: window effects and animations
SCALE=2
QUICK=software
EFFECTS=off
