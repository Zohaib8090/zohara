[package]
name = "zohara-migrator"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.37.0", features = ["full", "process"] }
anyhow = "1.0"

[[bin]]
name = "zohara-scan"
path = "src/bin/scan.rs"

[[bin]]
name = "zohara-migrator-daemon"
path = "src/bin/daemon.rs"
